
services:
  postgres:
    image: postgres:18
    container_name: careerops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerops
      POSTGRES_USER: careerops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5433:5432"
    volumes:
      - careerops-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerops -d careerops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  careerops-postgres-data:
